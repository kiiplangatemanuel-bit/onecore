name: OneCore API checks

on:
  push:
    paths:
      - "onecore-ecosystem/**"
      - ".github/workflows/onecore-ci.yml"
  pull_request:
    paths:
      - "onecore-ecosystem/**"
      - ".github/workflows/onecore-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/onecore-ecosystem
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: onecore-ecosystem/requirements.txt
      - name: Install dependencies
        working-directory: onecore-ecosystem
        run: python -m pip install -r requirements.txt
      - name: Apply database migrations
        working-directory: onecore-ecosystem
        run: alembic upgrade head
      - name: Verify migration downgrade and upgrade
        working-directory: onecore-ecosystem
        run: alembic downgrade base && alembic upgrade head
      - name: Compile Python modules
        run: python -m compileall -q onecore-ecosystem/app onecore-ecosystem/tests
      - name: Run tests
        run: python -m pytest -q onecore-ecosystem/tests
