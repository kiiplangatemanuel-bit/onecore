name: OneCore API checks

on:
  push:
    paths:
      - "onecore-ecosystem/**"
      - "frontend/**"
      - ".github/workflows/onecore-ci.yml"
  pull_request:
    paths:
      - "onecore-ecosystem/**"
      - "frontend/**"
      - ".github/workflows/onecore-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: onecore_test
          POSTGRES_USER: postgres
          # This is an isolated, ephemeral CI-only database. Trust auth avoids
          # password drift between the service container and the migration URL.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d onecore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: ${{ github.workspace }}/onecore-ecosystem
      SUPABASE_DB_URL: postgresql+psycopg://postgres@localhost:5432/onecore_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: onecore-ecosystem/requirements.txt
      - name: Install dependencies
        working-directory: onecore-ecosystem
        run: python -m pip install -r requirements.txt
      - name: Audit Python dependencies
        working-directory: onecore-ecosystem
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt
      - name: Apply database migrations
        working-directory: onecore-ecosystem
        run: alembic upgrade head
      - name: Verify migration downgrade and upgrade
        working-directory: onecore-ecosystem
        run: alembic downgrade base && alembic upgrade head
      - name: Compile Python modules
        run: python -m compileall -q onecore-ecosystem/app onecore-ecosystem/tests
      - name: Run tests
        working-directory: onecore-ecosystem
        run: python -m pytest -q tests

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Build Vercel frontend
        working-directory: frontend
        run: npm run build
  portal-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        portal: [support, status, developers, docs, community, trust, events, careers, partners, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install portal dependencies
        working-directory: frontend/portals/${{ matrix.portal }}
        run: npm install
      - name: Build independent portal
        working-directory: frontend/portals/${{ matrix.portal }}
        run: npm run build
