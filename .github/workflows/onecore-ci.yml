name: OneCore API checks

concurrency:
  group: onecore-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "onecore-ecosystem/**"
      - "frontend/**"
      - ".github/workflows/onecore-ci.yml"
  pull_request:
    paths:
      - "onecore-ecosystem/**"
      - "frontend/**"
      - ".github/workflows/onecore-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: onecore_test
          POSTGRES_USER: postgres
          # This is an isolated, ephemeral CI-only database. Trust auth avoids
          # password drift between the service container and the migration URL.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d onecore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: ${{ github.workspace }}/onecore-ecosystem
      SUPABASE_DB_URL: postgresql+psycopg://postgres@localhost:5432/onecore_test
      ONECORE_CI_RLS_ROLE: onecore_ci_runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: onecore-ecosystem/requirements.txt
      - name: Install dependencies
        working-directory: onecore-ecosystem
        run: python -m pip install -r requirements.txt
      - name: Audit Python dependencies
        working-directory: onecore-ecosystem
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt
      - name: Provision CI-only identity email worker role before migrations
        working-directory: onecore-ecosystem
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          engine = create_engine(
              os.environ["SUPABASE_DB_URL"],
              isolation_level="AUTOCOMMIT",
          )
          try:
              with engine.connect() as connection:
                  connection.execute(text(
                      "CREATE ROLE onecore_identity_email_worker NOLOGIN NOSUPERUSER "
                      "NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS"
                  ))
                  connection.execute(text(
                      "GRANT USAGE ON SCHEMA public TO onecore_identity_email_worker"
                  ))
          finally:
              engine.dispose()
          PY
      - name: Apply database migrations
        working-directory: onecore-ecosystem
        run: alembic upgrade head
      - name: Verify migration downgrade and upgrade
        working-directory: onecore-ecosystem
        run: alembic downgrade base && alembic upgrade head
      - name: Provision CI-only NOBYPASSRLS role for tenant behavior tests
        working-directory: onecore-ecosystem
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          engine = create_engine(
              os.environ["SUPABASE_DB_URL"],
              isolation_level="AUTOCOMMIT",
          )
          try:
              with engine.connect() as connection:
                  connection.execute(text(
                      "CREATE ROLE onecore_ci_runtime NOLOGIN NOSUPERUSER "
                      "NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS"
                  ))
                  connection.execute(text(
                      "GRANT USAGE ON SCHEMA public TO onecore_ci_runtime"
                  ))
                  connection.execute(text(
                      "GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE "
                      "public.memberships, public.records, public.audit_events "
                      "TO onecore_ci_runtime"
                  ))
                  connection.execute(text(
                      "GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public "
                      "TO onecore_ci_runtime"
                  ))
                  connection.execute(text(
                      "GRANT SELECT, INSERT ON TABLE public.identity_email_deliveries "
                      "TO onecore_ci_runtime"
                  ))
                  connection.execute(text(
                      "GRANT EXECUTE ON FUNCTION public.onecore_is_org_admin(integer), "
                      "public.onecore_is_platform_admin(), "
                      "public.onecore_is_org_owner(integer) TO onecore_ci_runtime"
                  ))
          finally:
              engine.dispose()
          PY
      - name: Compile Python modules
        run: python -m compileall -q onecore-ecosystem/app onecore-ecosystem/tests onecore-ecosystem/scripts
      - name: Run tests
        working-directory: onecore-ecosystem
        run: python -m pytest -q tests

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Build Vercel frontend
        working-directory: frontend
        run: npm run build
  portal-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        portal: [support, status, developers, docs, community, trust, events, careers, partners, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install portal dependencies
        working-directory: frontend/portals/${{ matrix.portal }}
        run: npm install
      - name: Build independent portal
        working-directory: frontend/portals/${{ matrix.portal }}
        run: npm run build
