<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OneCore CRM Forecasts</title><style>
body{font:15px system-ui;margin:0;background:#f4f6fa;color:#182438}main{max-width:1100px;margin:auto;padding:24px}section{background:white;border:1px solid #dce3ed;border-radius:12px;padding:18px;margin:14px 0}label{display:block;font-weight:600;margin:8px 0 4px}input,select,button{font:inherit;padding:9px;border:1px solid #aab7c8;border-radius:7px;max-width:100%}button{cursor:pointer;background:#163d68;color:white;border:0;margin:8px 4px 8px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.muted{color:#59687a}.error{color:#a21d1d}pre{white-space:pre-wrap;overflow-wrap:anywhere}
</style></head><body><main><h1>CRM sales performance</h1><p class="muted">Forecasts, quotas, scenarios, accuracy and campaign ROI.</p>
<section><h2>Secure API session</h2><label for="token">Bearer access token (held in page memory)</label><input id="token" type="password" autocomplete="off" style="width:min(700px,100%)"><p id="message" role="status" class="muted">Enter an authorized CRM token.</p></section>
<section><h2>Forecast dashboard</h2><div class="grid"><div><label for="period">Period</label><select id="period"><option value="month">Month</option><option value="quarter">Quarter</option><option value="year">Year</option></select></div><div><label for="start">Period date</label><input id="start" type="date"></div><div><label for="rep">Representative ID (optional)</label><input id="rep" type="number" min="1"></div></div><button id="load">Load forecast</button><button id="accuracy">Forecast accuracy</button><button id="health">Scheduler health</button><div id="dashboard" aria-live="polite"></div></section>
<section><h2>Set sales quota</h2><div class="grid"><div><label for="targetPeriod">Period</label><select id="targetPeriod"><option>month</option><option>quarter</option><option>year</option></select></div><div><label for="targetStart">Period start date</label><input id="targetStart" type="date"></div><div><label for="targetRep">Representative ID (blank = team)</label><input id="targetRep" type="number" min="1"></div><div><label for="currency">Currency</label><input id="currency" value="KES" maxlength="3"></div><div><label for="amount">Target amount</label><input id="amount" type="number" min="0" step=".01"></div></div><button id="saveTarget">Save target</button></section>
<section><h2>Forecast snapshot</h2><label for="scenario">Scenario</label><select id="scenario"><option>expected</option><option>best_case</option><option>worst_case</option></select><button id="snapshot">Capture immutable snapshot</button></section>
<section><h2>Campaign ROI</h2><p class="muted">Uses explicit attributed order-won and invoice-paid revenue.</p><button id="roi">Load campaign ROI</button><div id="roiData"></div></section></main>
<script>
const el=id=>document.getElementById(id),iso=d=>{const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)};el("start").value=iso(new Date());el("targetStart").value=iso(new Date());
function headers(){const t=el("token").value.trim();if(!t)throw Error("Enter a bearer token first.");return {Authorization:"Bearer "+t,"Content-Type":"application/json"}}
async function req(path,opt={}){const r=await fetch("/api/v1/crm"+path,{...opt,headers:{...headers(),...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||("Request failed: "+r.status));return d}
function show(id,data){const p=document.createElement("pre");p.textContent=JSON.stringify(data,null,2);el(id).replaceChildren(p)}
function params(){const p=new URLSearchParams({period_type:el("period").value,start_date:el("start").value});if(el("rep").value)p.set("rep_id",el("rep").value);return p.toString()}
async function run(fn){try{el("message").textContent="Working…";await fn();el("message").textContent="Updated successfully."}catch(e){el("message").textContent=e.message;el("message").className="error"}}
el("load").onclick=()=>run(async()=>show("dashboard",await req("/forecast/advanced?"+params())));
el("accuracy").onclick=()=>run(async()=>show("dashboard",await req("/forecast/accuracy?"+params())));
el("health").onclick=()=>run(async()=>show("dashboard",await req("/scheduler/health")));
el("saveTarget").onclick=()=>run(async()=>{const d={period_type:el("targetPeriod").value,period_start:el("targetStart").value,target_amount:el("amount").value,currency:el("currency").value.toUpperCase()};if(el("targetRep").value)d.assigned_to=Number(el("targetRep").value);show("dashboard",await req("/targets",{method:"POST",body:JSON.stringify(d)}))});
el("snapshot").onclick=()=>run(async()=>{const d={period_type:el("period").value,period_start:el("start").value,scenario:el("scenario").value};if(el("rep").value)d.rep_id=Number(el("rep").value);show("dashboard",await req("/forecast/snapshots",{method:"POST",body:JSON.stringify(d)}))});
el("roi").onclick=()=>run(async()=>show("roiData",await req("/campaigns/roi")));
</script></body></html>
