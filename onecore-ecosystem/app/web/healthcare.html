<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>OneCore Healthcare</title><style>body{font:15px system-ui;margin:24px auto;max-width:1000px;padding:0 16px;color:#17283e}section{border:1px solid #d8e0e9;border-radius:12px;padding:16px;margin:16px 0}input,textarea,button{font:inherit;padding:9px;margin:5px;max-width:100%}textarea{width:95%;min-height:90px}label{display:block}pre{white-space:pre-wrap;background:#f3f6fa;padding:12px}</style></head><body><h1>Healthcare records</h1><p>Authorized clinical staff only. Patient data is not stored in browser storage; use TLS and a managed encryption key.</p><label>Bearer token <input id="token" type="password" autocomplete="off" style="width:70%"></label><p id="status" role="status"></p>
<section><h2>Register patient</h2><form id="create"><input name="mrn" placeholder="Medical record number" required><input name="branch" placeholder="Branch ID (optional)"><textarea name="profile" placeholder='{"full_name":"...","date_of_birth":"...","phone":"..."}' required></textarea><button>Create patient</button></form></section>
<section><h2>Patient record</h2><label>Patient ID <input id="patientId" type="number"></label><label>Reason for access <input id="reason"></label><button id="read">Read patient</button><pre id="patient"></pre></section>
<section><h2>Clinical encounter</h2><form id="encounter"><input name="type" placeholder="Encounter type" value="consultation"><textarea name="note" placeholder='{"assessment":"...","plan":"..."}' required></textarea><button>Create encounter</button></form><button id="history">Load encounter history</button><pre id="encounters"></pre></section>
<section><h2>Grant patient access</h2><form id="grant"><input name="user_id" type="number" placeholder="Organization user ID" required><select name="access_level"><option>read</option><option>write</option></select><input name="expires_at" placeholder="Optional expiry ISO timestamp"><button>Grant access</button></form></section>
<script>
const $=id=>document.getElementById(id);const status=m=>$("status").textContent=m;
async function api(path,method="GET",body){const token=$("token").value.trim();if(!token)throw Error("Enter an access token.");const r=await fetch("/api/v1"+path,{method,headers:{"Authorization":"Bearer "+token,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined,cache:"no-store"});const d=await r.json();if(!r.ok)throw Error(d.detail||"Request failed");return d;}
const pid=()=>Number($("patientId").value);
$("create").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);try{const x=await api("/healthcare/patients","POST",{medical_record_number:f.get("mrn"),branch_id:f.get("branch")||null,profile:JSON.parse(f.get("profile"))});$("patientId").value=x.id;status("Patient created.");}catch(e){status(e.message);}};
$("read").onclick=async()=>{try{$("patient").textContent=JSON.stringify(await api("/healthcare/patients/"+pid()+"?reason="+encodeURIComponent($("reason").value)),null,2);}catch(e){status(e.message);}};
$("encounter").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);try{const x=await api("/healthcare/patients/"+pid()+"/encounters?reason="+encodeURIComponent($("reason").value),"POST",{encounter_type:f.get("type"),clinical_note:JSON.parse(f.get("note"))});status("Encounter saved: "+x.encounter_id);}catch(e){status(e.message);}};
$("history").onclick=async()=>{try{$("encounters").textContent=JSON.stringify(await api("/healthcare/patients/"+pid()+"/encounters?reason="+encodeURIComponent($("reason").value)),null,2);}catch(e){status(e.message);}};
$("grant").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const p={user_id:Number(f.get("user_id")),access_level:f.get("access_level")};if(f.get("expires_at"))p.expires_at=f.get("expires_at");try{const x=await api("/healthcare/patients/"+pid()+"/access","POST",p);status("Access granted: "+x.grant_id);}catch(e){status(e.message);}};
</script></body></html>
