<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>OneCore CRM Automation</title><style>body{font:15px system-ui;margin:24px auto;max-width:1000px;padding:0 16px;color:#17283e}section{border:1px solid #d8e0e9;border-radius:12px;padding:16px;margin:16px 0}input,textarea,select,button{font:inherit;padding:9px;margin:5px;max-width:100%}textarea{width:95%;min-height:75px}pre{white-space:pre-wrap;background:#f3f6fa;padding:12px}label{display:block}</style></head><body><h1>CRM campaign automation</h1><p>Access token stays in this page's memory and is not saved in browser storage.</p><label>Bearer token <input id="token" type="password" autocomplete="off" style="width:70%"></label><p id="status" role="status"></p>
<section><h2>Reusable template</h2><form id="template"><input name="name" placeholder="Template name" required><select name="channel"><option>email</option><option>sms</option><option>whatsapp</option></select><select name="purpose"><option>marketing</option><option>transactional</option></select><input name="subject" placeholder="Subject"><textarea name="body" placeholder="Message; use {{full_name}}, {{email}}, {{phone}}, {{company}}" required></textarea><input name="variables" placeholder="Variables (comma separated)"><button>Create template</button></form><div id="templates"></div></section>
<section><h2>Audience segments</h2><form id="segment"><input name="name" placeholder="Segment name" required><textarea name="rules" required>{"all":[{"field":"company","op":"contains","value":"Retail"}],"any":[]}</textarea><button>Create segment</button></form><label>Segment ID <input id="segmentId" type="number"></label><button id="preview">Preview segment</button><pre id="previewResult"></pre></section>
<section><h2>Schedule campaign</h2><label>Campaign ID <input id="campaignId" type="number"></label><label>Scheduled time (include timezone, e.g. 2026-12-01T09:00:00+03:00) <input id="scheduledAt" style="width:70%"></label><button id="schedule">Schedule campaign</button><p>Worker: configure a trusted service identity to POST /api/v1/crm/scheduler/run-due every minute.</p></section>
<script>
const $=id=>document.getElementById(id);const status=m=>$("status").textContent=m;
async function api(path,method="GET",body){const token=$("token").value.trim();if(!token)throw Error("Enter an access token.");const r=await fetch("/api/v1"+path,{method,headers:{"Authorization":"Bearer "+token,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined,cache:"no-store"});const d=await r.json();if(!r.ok)throw Error(d.detail||"Request failed");return d;}
$("template").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);try{const x=await api("/crm/templates","POST",{name:f.get("name"),channel:f.get("channel"),purpose:f.get("purpose"),subject:f.get("subject"),body:f.get("body"),variables:String(f.get("variables")).split(",").map(x=>x.trim()).filter(Boolean)});status("Template created: "+x.id);loadTemplates();}catch(x){status(x.message);}};
async function loadTemplates(){try{$("templates").textContent=JSON.stringify(await api("/crm/templates"),null,2);}catch(e){status(e.message);}}
$("segment").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);try{const x=await api("/crm/segments","POST",{name:f.get("name"),rules:JSON.parse(f.get("rules"))});$("segmentId").value=x.id;status("Segment created: "+x.id);}catch(x){status(x.message);}};
$("preview").onclick=async()=>{try{$("previewResult").textContent=JSON.stringify(await api("/crm/segments/"+Number($("segmentId").value)+"/preview"),null,2);}catch(e){status(e.message);}};
$("schedule").onclick=async()=>{try{const x=await api("/crm/campaigns/"+Number($("campaignId").value)+"/schedule","POST",{scheduled_at:$("scheduledAt").value,timezone:"Africa/Nairobi"});status("Campaign scheduled for "+x.scheduled_at);}catch(e){status(e.message);}};
loadTemplates();
</script></body></html>
