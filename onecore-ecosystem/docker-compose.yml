services:
  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: ${ONECORE_DATABASE_URL:-${DATABASE_URL:-sqlite:////app/data/onecore.db}}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    volumes:
      - onecore_data:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  crm-scheduler:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: ${ONECORE_DATABASE_URL:-sqlite:////app/data/onecore.db}
    command: ["python", "-m", "app.workers.crm_scheduler"]
    volumes:
      - onecore_data:/app/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; p='/tmp/crm-scheduler-heartbeat'; assert os.path.exists(p) and time.time()-os.path.getmtime(p)<120"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
volumes:
  onecore_data:
